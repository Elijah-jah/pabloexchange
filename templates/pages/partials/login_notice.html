{% if show_login_notice %}
<!-- ============================================
     PABLOEXCHANGE - LOGIN ANNOUNCEMENT POPUP
     Shows once immediately after every login.
     ============================================ -->
<style>
    .plx-notice-overlay {
        position: fixed;
        inset: 0;
        background: rgba(4, 46, 26, 0.55);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .plx-notice-card {
        background: #ffffff;
        border-radius: 24px;
        max-width: 420px;
        width: 100%;
        padding: 36px 26px 26px;
        text-align: center;
        position: relative;
        box-shadow: 0 25px 60px rgba(4, 46, 26, 0.35);
        animation: plxNoticePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        font-family: inherit;
    }

    @keyframes plxNoticePop {
        from { transform: scale(0.85) translateY(20px); opacity: 0; }
        to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    .plx-notice-close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: #eef5f0;
        color: #0b3d24;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }

    .plx-notice-close:hover { background: #dcebe2; }

    .plx-notice-icon {
        width: 66px;
        height: 66px;
        border-radius: 20px;
        background: linear-gradient(135deg, #0b3d24 0%, #128a4c 100%);
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 26px;
        box-shadow: 0 12px 26px rgba(11, 61, 36, 0.35);
    }

    .plx-notice-pill {
        display: inline-block;
        background: #e6f4ec;
        color: #0b6b3a;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 6px 18px;
        border-radius: 999px;
        margin-bottom: 12px;
    }

    .plx-notice-title {
        font-size: 26px;
        font-weight: 800;
        color: #0b3d24;
        margin: 0 0 12px;
    }

    .plx-notice-text {
        font-size: 15px;
        line-height: 1.65;
        color: #4a5f53;
        margin: 0 0 24px;
    }

    .plx-notice-join {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        background: linear-gradient(135deg, #0b3d24 0%, #128a4c 100%);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        padding: 16px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 10px 22px rgba(11, 61, 36, 0.3);
        transition: transform 0.15s, box-shadow 0.15s;
        margin-bottom: 12px;
    }

    .plx-notice-join:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(11, 61, 36, 0.4);
    }

    .plx-notice-row {
        display: flex;
        gap: 12px;
    }

    .plx-notice-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        border: none;
    }

    .plx-notice-copy {
        background: #eef5f0;
        color: #0b3d24;
        border: 1px solid #d3e6da;
    }

    .plx-notice-copy:hover { background: #e0efe6; }

    .plx-notice-gotit {
        background: #ffffff;
        color: #0b3d24;
        border: 2px solid #e6f4ec;
    }

    .plx-notice-gotit:hover { background: #f4faf6; }

    @media (max-width: 480px) {
        .plx-notice-card { padding: 30px 20px 22px; border-radius: 20px; }
        .plx-notice-title { font-size: 22px; }
        .plx-notice-text { font-size: 14px; }
    }
</style>

<div class="plx-notice-overlay" id="plxNoticeOverlay">
    <div class="plx-notice-card">

        <button type="button" class="plx-notice-close" onclick="plxCloseNotice()" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>

        <div class="plx-notice-icon">
            <i class="fas fa-bell"></i>
        </div>

        <span class="plx-notice-pill">Announcement</span>

        <h2 class="plx-notice-title">New Update</h2>

        <p class="plx-notice-text">
            Our official Telegram Community is now available!<br><br>
            Join our community to receive the latest updates,
            announcements, new products and important information from us.
        </p>

        <a href="https://t.me/exchangemarketplace1" target="_blank" class="plx-notice-join">
            <i class="fab fa-telegram-plane"></i> Join New Channel
        </a>

        <div class="plx-notice-row">
            <button type="button" class="plx-notice-btn plx-notice-copy" onclick="plxCopyNoticeLink(this)">
                <i class="far fa-copy"></i> <span>Copy Link</span>
            </button>
            <button type="button" class="plx-notice-btn plx-notice-gotit" onclick="plxCloseNotice()">
                Got it
            </button>
        </div>

    </div>
</div>

<script>
    function plxCloseNotice() {
        var overlay = document.getElementById("plxNoticeOverlay");
        if (overlay) overlay.remove();
    }

    function plxCopyNoticeLink(btn) {
        var link = "https://t.me/exchangemarketplace1";
        function done() {
            var label = btn.querySelector("span");
            if (label) {
                var old = label.textContent;
                label.textContent = "Copied!";
                setTimeout(function () { label.textContent = old; }, 1800);
            }
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(done).catch(done);
        } else {
            var tmp = document.createElement("textarea");
            tmp.value = link;
            document.body.appendChild(tmp);
            tmp.select();
            document.execCommand("copy");
            document.body.removeChild(tmp);
            done();
        }
    }

    // Click the dark background to close
    document.getElementById("plxNoticeOverlay").addEventListener("click", function (e) {
        if (e.target === this) plxCloseNotice();
    });
</script>
{% endif %}
